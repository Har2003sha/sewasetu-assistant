
services:
  app:
    build: ./app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_PATH: /data/sewasetu.db
      UPLOAD_DIR: /data/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      SMS_PROVIDER: simulator
    depends_on:
      smsgw:
        condition: service_started
    volumes:
      - appdata:/data
      - applogs:/var/log/sewasetu
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 10

  scheduler:
    build: ./app
    restart: unless-stopped
    command: ["python", "/app/scripts/deemed_approval.py"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - appdata:/data
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    restart: unless-stopped
    expose:
      - "8025"

  mcp-citizen:
    build: ./mcp
    restart: unless-stopped
    command: ["python", "server.py", "citizen"]
    environment: &mcpenv
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORTAL_INTERNAL_URL: http://app:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "8101"

  mcp-officer:
    build: ./mcp
    restart: unless-stopped
    command: ["python", "server.py", "officer"]
    environment: *mcpenv
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "8102"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app
      - mcp-citizen
      - mcp-officer

volumes:
  appdata:
  applogs:
  caddydata:
